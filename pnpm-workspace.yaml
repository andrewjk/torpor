packages:
  - packages/*
  - packages/adapters/*
  - site
  - examples/*
  - benchmarks/*
  - benchmarks/build/servers/torpor

catalogs:
  default:
    vite: npm:@voidzero-dev/vite-plus-core@0.3.0
    vite-plus: 0.3.0
    vitest: 4.1.10

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  playwright: true
  workerd: true

onlyBuiltDependencies:
  - esbuild

minimumReleaseAgeExclude:
  - allmark@1.0.22
