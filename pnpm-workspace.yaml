packages:
  - packages/*
  - packages/adapters/*
  - packages/unplugin/test/fixtures/*
  - site
  - examples/*
  - benchmarks/*
  - benchmarks/build/servers/torpor

catalogs:
  default:
    vite: npm:@voidzero-dev/vite-plus-core@1.2.0
    vite-plus: 1.2.0
    vitest: 5.0.3

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  playwright: true
  workerd: true

onlyBuiltDependencies:
  - esbuild

# @torpor/ui lists @torpor/unplugin as a dependency (it's imported by ui's
# vitest.config), and @torpor/unplugin devDepends on @torpor/ui for its tests.
# Neither `build` script needs the other (both tsconfigs only include `src`,
# and ui's vite.config doesn't import the unplugin), but the package-level
# cycle is real, so pnpm 11.25+/12 refuses to order the recursive build. Let
# the two tasks run unordered rather than break a deliberate test dependency.
ignoreWorkspaceCycles: true

minimumReleaseAgeExclude:
  - allmark@1.0.22
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
